    <script>
      // Apply the last-used theme before first paint (settings live in IndexedDB and load later).
      (function () {
        try {
          var pref = localStorage.getItem('calmobile:theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
